  <!-- CONTACT -->
  <section class="section section-alt" id="contact">
    <div class="container contact-container">
      <h2 class="section-title" data-i18n="contact.heading"></h2>
      <p class="section-sub" data-i18n="contact.subtitle"></p>

      <form class="contact-form" id="contactForm">
        <!--
          ┌─────────────────────────────────────────────────────────────────┐
          │  SETUP — do this once before publishing:                        │
          │                                                                 │
          │  1. FORM DELIVERY: Go to https://web3forms.com                 │
          │     Enter your email and paste the Access Key below.            │
          │     Replace: YOUR_WEB3FORMS_ACCESS_KEY                         │
          │                                                                 │
          │  2. CAPTCHA (production): Go to dash.cloudflare.com            │
          │     Turnstile → Add Site → copy the Site Key.                  │
          │     Replace: 1x00000000000000000000AA  (that's the test key)   │
          │     The test key works now so you can develop without an acct. │
          └─────────────────────────────────────────────────────────────────┘
        -->
        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY" />
        <input type="hidden" name="subject" value="New message from portfolio site" />
        <input type="hidden" name="from_name" value="Portfolio Contact Form" />
        <!-- Honeypot: invisible to humans, bots fill it and get blocked -->
        <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off" />

        <div class="form-row">
          <div class="form-group">
            <label for="fname" data-i18n="contact.name"></label>
            <input type="text" id="fname" name="name" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="femail" data-i18n="contact.email"></label>
            <input type="email" id="femail" name="email" required autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label for="fmessage" data-i18n="contact.message"></label>
          <textarea id="fmessage" name="message" rows="5" required></textarea>
        </div>

        <!-- Cloudflare Turnstile CAPTCHA -->
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAADOCwO6ZX4RSiBNs"
          data-callback="onTurnstileSuccess"
          data-theme="light">
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
          <span data-i18n="contact.send"></span>
        </button>

        <div class="form-status" id="formStatus" role="alert" aria-live="polite"></div>
      </form>
    </div>
  </section>
